  <!-- rim -->
  <circle cx="218" cy="218" r="118" fill="none" stroke="#e9dcb9" stroke-width="30"/>
  <!-- handle -->
  <line x1="306" y1="306" x2="330" y2="330" stroke="#e9dcb9" stroke-width="34"/>
  <line x1="336" y1="336" x2="420" y2="420" stroke="#8a6a3a" stroke-width="50" stroke-linecap="round"/>
