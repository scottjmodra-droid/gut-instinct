    <path d="M196 98 C192 122 192 146 204 166" fill="none" stroke="#c8312b" stroke-width="24" stroke-linecap="round"/>
    <path d="M200 158 C252 146 304 176 300 232 C296 290 240 316 196 304 C166 296 148 276 158 258 C168 242 190 252 206 246 C232 236 236 206 214 196 C196 188 186 178 200 158 Z" fill="#c8312b"/>
    <path d="M160 262 C140 270 132 292 140 320" fill="none" stroke="#c8312b" stroke-width="20" stroke-linecap="round"/>
  </g>
